# Fabrique l'APK Android automatiquement et le publie dans « Releases » (gratuit).
name: APK Android
on:
  push:
    branches: [main, imposteur-party]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - name: Projet Android (Capacitor)
        run: |
          npm i --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          # micro pour le chat vocal et la reconnaissance vocale
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Compilation de l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../imposteur-party.apk
      - uses: actions/upload-artifact@v4
        with:
          name: imposteur-party-apk
          path: imposteur-party.apk
      - name: Publication dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Imposteur Party (build ${{ github.run_number }})
          body: APK Android d'Imposteur Party. Télécharge imposteur-party.apk et installe-le (autorise les sources inconnues).
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: imposteur-party.apk
