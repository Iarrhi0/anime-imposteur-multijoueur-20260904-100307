name: Build Anime Imposteur Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: anime-imposteur-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/Anime-Imposteur-v8.5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anime-Imposteur-Android-v8.5
          path: apk-output/Anime-Imposteur-v8.5.apk
          if-no-files-found: error
          retention-days: 30
