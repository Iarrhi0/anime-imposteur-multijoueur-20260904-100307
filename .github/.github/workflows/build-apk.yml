name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle -p android :app:assembleDebug

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Anime-Imposteur.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anime-Imposteur-APK
          path: Anime-Imposteur.apk
          if-no-files-found: error
